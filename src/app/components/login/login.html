
<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <h1>SmartOps</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          autocomplete="username"
          required
          [disabled]="loading"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>

        
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
            [disabled]="loading"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [disabled]="loading"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.title]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg
              *ngIf="!showPassword"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>

            <svg
              *ngIf="showPassword"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
              <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3.1 3.8"></path>
              <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.6-.8"></path>
            </svg>
          </button>
        </div>

      </div>

      <!-- Error message -->
      <div
        class="error"
        *ngIf="errorMessage"
        role="alert"
        aria-live="assertive"
      >
        <span class="error-icon" aria-hidden="true">!</span>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Sign-in button -->
      <button
        class="login-button"
        type="submit"
        [disabled]="loading"
      >
        <span *ngIf="loading" class="loading-spinner"></span>

        <span>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </span>
      </button>

    </form>

    <p class="login-footer">
      Secure access to SmartOps
    </p>

  </div>
</div>
