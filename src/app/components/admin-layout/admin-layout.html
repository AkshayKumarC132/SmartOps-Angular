<div class="admin-layout">

  <!-- =====================================================
       LEFT SIDEBAR
       ===================================================== -->

  <aside class="sidebar">

    <!-- ===================================================
         BRAND
         =================================================== -->

    <div class="brand">

      <div class="brand-icon">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>

      </div>

      <div class="brand-text">

        <div class="brand-title">
          SmartOps Hub
        </div>

        <div class="brand-subtitle">
          Admin Portal
        </div>

      </div>

    </div>


    <!-- ===================================================
         NAVIGATION
         =================================================== -->

    <nav class="sidebar-nav">

      <div class="nav-section-title">
        Navigation
      </div>


      <!-- DASHBOARD -->

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="4"
            y="4"
            width="6"
            height="6"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <rect
            x="14"
            y="4"
            width="6"
            height="6"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <rect
            x="4"
            y="14"
            width="6"
            height="6"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <rect
            x="14"
            y="14"
            width="6"
            height="6"
            rx="1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

        </svg>

        <span>
          Dashboard
        </span>

      </a>


      <!-- TICKETS -->

      <a
        routerLink="/tickets"
        routerLinkActive="active"
        class="nav-item"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M4 7h16v10H4z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

          <path
            d="M8 7v3M16 7v3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M8 14h8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

        <span>
          Tickets
        </span>

      </a>


      <!-- KNOWLEDGE BASE -->

      <a
        routerLink="/knowledge-base"
        routerLinkActive="active"
        class="nav-item"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

          <path
            d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M8 7h8M8 10h8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />

        </svg>

        <span>
          Knowledge Base
        </span>

      </a>


      <!-- AI RESULTS -->

      <a
        routerLink="/ai-results"
        routerLinkActive="active"
        class="nav-item"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M12 3a5 5 0 0 0-5 5c0 2 1 3 2 4s1 2 1 4h4c0-2-1-3 1-4s2-2 2-4a5 5 0 0 0-5-5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M9 20h6M10 17h4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="8"
            r="1"
            fill="currentColor"
          />

        </svg>

        <span>
          AI Results
        </span>

      </a>


      <!-- ===================================================
           ADMINISTRATION
           =================================================== -->

      <div class="nav-section-title administration-title">
        Administration
      </div>


      <!-- TEAMS -->

      <a
        routerLink="/teams"
        routerLinkActive="active"
        class="nav-item"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="9"
            cy="8"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <circle
            cx="17"
            cy="9"
            r="2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M3.5 19a5.5 5.5 0 0 1 11 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M14.5 14.5a4.5 4.5 0 0 1 6 4.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

        <span>
          Teams
        </span>

      </a>


      <!-- USER MANAGEMENT -->

      <a
        routerLink="/user-management"
        routerLinkActive="active"
        class="nav-item"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="9"
            cy="8"
            r="3"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <circle
            cx="17"
            cy="9"
            r="2.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M3.5 19a5.5 5.5 0 0 1 11 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M14.5 14.5a4.5 4.5 0 0 1 6 4.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

        </svg>

        <span>
          User Management
        </span>

      </a>


      <!-- SLA CONFIG -->

      <!-- SLA CONFIG -->

      <a
      routerLink="/sla-config"
      routerLinkActive="active"
      class="nav-item"
      >

     <svg
    viewBox="0 0 24 24"
    aria-hidden="true"
     >

    <circle
      cx="12"
      cy="12"
      r="8"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    />

    <path
      d="M12 7v5l3 2"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

  </svg>

  <span>
    SLA Config
  </span>

</a>


      <!-- AUDIT LOG -->

      <div class="nav-item disabled-nav-item">

        <span>
        ≋  Audit Log
        </span>

      </div>


      <!-- ===================================================
           OTHER
           =================================================== -->

      <div class="nav-section-title other-title">
        Other
      </div>


      <!-- NOTIFICATIONS -->

      <div class="nav-item disabled-nav-item">

        <span>
        🔔Notifications
        </span>

      </div>


      <!-- SETTINGS -->

      <div class="nav-item disabled-nav-item">

        <span>
          ⚙️Settings
        </span>

      </div>

    </nav>

  </aside>


  <!-- =====================================================
       MAIN AREA
       ===================================================== -->

  <main class="main-area">


    <!-- ===================================================
         TOPBAR
         =================================================== -->

    <header class="topbar">


      <!-- Left -->

      <div class="topbar-left">

        <svg
          class="topbar-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M4 12h16M12 4l8 8-8 8"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

        <span>
          Admin Portal
        </span>

      </div>


      <!-- Right -->

      <div class="topbar-user">


        <!-- Notification -->

        <div class="notification">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M10 21h4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

          </svg>

          <span
            class="notification-count"
            *ngIf="notificationCount > 0"
          >
            {{ notificationCount }}
          </span>

        </div>


        <!-- Dynamic Avatar -->

        <div
          class="avatar"
          *ngIf="avatarLetter"
        >
          {{ avatarLetter }}
        </div>


        <!-- Dynamic Role -->

        <span class="role">
          {{ userRole }}
        </span>


        <!-- Logout -->

        <button
          type="button"
          class="logout"
          (click)="logout()"
          title="Logout"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

            <path
              d="M14 8l4 4-4 4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M9 12h9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

          </svg>

        </button>

      </div>

    </header>


    <!-- ===================================================
         PAGE CONTENT
         =================================================== -->

    <section class="page-content">

      <!-- Child pages load here -->

      <router-outlet></router-outlet>

    </section>


  </main>

</div>
